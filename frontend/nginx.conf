# Nginx configuration for Bolkhata frontend (production Docker container).
#
# Networking design
# -----------------
# The browser only ever talks to Nginx (port 3000).
# API requests arrive as /api/... and are forwarded server-side to the
# backend container using its Docker internal hostname "backend:8000".
# The /api prefix is stripped before forwarding so the backend sees clean paths.
#
# The Docker internal hostname "backend" is NEVER exposed to the browser:
# it appears only in this server-side proxy_pass directive.

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- API reverse proxy ---
    # Browser sends:  GET /api/health
    # Nginx forwards: GET http://backend:8000/health  (strips /api prefix)
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # --- SPA fallback ---
    # All other requests serve index.html so React Router can handle routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
}
