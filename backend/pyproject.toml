[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bolkhata"
version = "0.1.0"
description = "Voice-first ledger for Indian kirana shopkeepers"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.2",
    "pydantic-settings==2.6.1",
    "sqlalchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    "alembic==1.14.0",
    "structlog==24.4.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
pg = [
    "psycopg[binary]==3.2.3",
]
mlx-whisper = [
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "anyio==4.6.2",
    "ruff==0.8.2",
    "mypy==1.13.0",
    "detect-secrets==1.5.0",
    "pre-commit==4.7.0",
    "jiwer>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bolkhata"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PT", "RUF"]
ignore = ["E501"]  # line length handled by formatter
allowed-confusables = ["०", "४", "৭", "‘", "’", "–"]

[tool.ruff.lint.per-file-ignores]
"src/bolkhata/domains/common/numbers.py" = ["RUF001", "RUF002"]
"src/bolkhata/domains/common/bengali_numbers.py" = ["RUF001", "RUF002"]
"src/bolkhata/domains/common/number_words.py" = ["RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["bolkhata"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/bolkhata"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "aiosqlite.*"]
follow_imports = "skip"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
