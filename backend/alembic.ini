# Alembic configuration file.
# This file is used by `alembic` CLI independently of FastAPI startup.
# The script_location path is relative to this file's directory.

[alembic]
script_location = alembic
prepend_sys_path = src

# DATABASE_URL is read from the environment (or .env) at migration time.
# This placeholder is overridden in alembic/env.py using Settings.
sqlalchemy.url = sqlite+aiosqlite:///./bolkhata.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
