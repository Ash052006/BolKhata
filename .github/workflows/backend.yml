name: Backend CI

'on':
  push:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Ruff · mypy · pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.3"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --python 3.11

      - name: Ruff lint
        run: uv run ruff check src/

      - name: mypy type check
        run: uv run mypy src/bolkhata

      - name: pytest
        run: uv run pytest ../tests/ -v
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_bolkhata.db"
